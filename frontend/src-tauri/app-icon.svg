<svg width="1024" height="1024" 
        
        
        viewBox="0 0 64 64" 
        fill="none" 
        xmlns="http://www.w3.org/2000/svg"
       
      >
        <defs>
          
          <linearGradient id="badgeBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0b1329" />
            <stop offset="50%" stop-color="#080e1e" />
            <stop offset="100%" stop-color="#030712" />
          </linearGradient>

          <linearGradient id="badgeBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
            <stop offset="40%" stop-color="#818cf8" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
          </linearGradient>

          
          <linearGradient id="branchMain" x1="20" y1="52" x2="20" y2="14" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="60%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>

          <linearGradient id="branchFork" x1="20" y1="36" x2="44" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#10b981" />
          </linearGradient>

          
          <radialGradient id="radarSweep" cx="32" cy="32" r="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
            <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
          </radialGradient>
        </defs>

        
        <rect 
          x="1" 
          y="1" 
          width="62" 
          height="62" 
          rx="18" 
          fill="url(#badgeBg)" 
          stroke="url(#badgeBorder)" 
          stroke-width="1.5" 
        />

        
        <circle cx="32" cy="32" r="24" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1" stroke-dasharray="3 3" />
        <circle cx="32" cy="32" r="16" stroke="rgba(99, 102, 241, 0.18)" stroke-width="1" />
        <circle cx="32" cy="32" r="8" stroke="rgba(16, 185, 129, 0.22)" stroke-width="1" stroke-dasharray="2 2" />

        
        <line x1="32" y1="8" x2="32" y2="12" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" stroke-linecap="round" />
        <line x1="32" y1="52" x2="32" y2="56" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" stroke-linecap="round" />
        <line x1="8" y1="32" x2="12" y2="32" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" stroke-linecap="round" />
        <line x1="52" y1="32" x2="56" y2="32" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" stroke-linecap="round" />

        
        <path 
         
          d="M 32 32 L 56 32 A 24 24 0 0 0 49 15 Z" 
          fill="url(#radarSweep)" 
        />

        

        
        <path 
          d="M 22 48 L 22 18" 
          stroke="url(#branchMain)" 
          stroke-width="3.2" 
          stroke-linecap="round" 
        />

        
        <path 
          d="M 22 36 C 22 28, 30 22, 42 22" 
          stroke="url(#branchFork)" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none" 
        />

        

        
        <circle cx="22" cy="48" r="4.5" fill="#06b6d4" />
        <circle cx="22" cy="48" r="2.2" fill="#ffffff" />

        
        <circle cx="22" cy="36" r="3.8" fill="#6366f1" />
        <circle cx="22" cy="36" r="1.8" fill="#ffffff" />

        
        <circle cx="22" cy="18" r="4.5" fill="#a855f7" />
        <circle cx="22" cy="18" r="2.2" fill="#ffffff" />

        
        <circle cx="42" cy="22" r="5" fill="#10b981" />
        <circle cx="42" cy="22" r="2.5" fill="#ffffff" />

        
        <circle 
          
          cx="42" 
          cy="22" 
          r="8" 
          stroke="#34d399" 
          stroke-width="1.2" 
          fill="none" 
          opacity="0.6" 
        />
      </svg>