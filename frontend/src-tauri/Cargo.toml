[package]
name = "gittrend-radar"
version = "0.1.7"
description = "GitTrend Radar"
authors = ["Victor Bianchini"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "native-tls", "charset", "gzip"] }
scraper = "0.27.0"
regex = "1.13.1"
chrono = "0.4.45"
tauri-plugin-notification = "2.7.0"
tauri-plugin-dialog = "2.8.3"
